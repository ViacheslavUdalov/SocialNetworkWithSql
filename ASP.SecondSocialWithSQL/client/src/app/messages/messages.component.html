<div class="row mb-4">
  <div class="btn-group" name="container">
    <button class="btn btn-primary" btnRadio="Unread" [(ngModel)]="container" (click)="loadMessages()">
      <i class="fa fa-envelope"></i> Unread
    </button>
    <button class="btn btn-primary" btnRadio="Unread" [(ngModel)]="container" (click)="loadMessages()">
      <i class="fa fa-envelope-open"></i> Inbox
    </button>
    <button class="btn btn-primary" btnRadio="Unread" [(ngModel)]="container" (click)="loadMessages()">
      <i class="fa fa-paper-plane"></i> Outbox
    </button>
  </div>
</div>
<div class="row" *ngIf="messages?.length === 0">
<h3>Нет сообщений</h3>
</div>
<div class="row" *ngIf="messages?.length > 0">
  <table class="table table-hover" style="cursor: pointer">
    <tr>
      <th style="width: 40%">Сообщение</th>
      <th style="width: 20%">Кому\Куда</th>
      <th style="width: 20%">Время</th>
      <th style="width: 20%"></th>
    </tr>
    <tr [hidden]="loading" *ngFor="let message of messages"
    routerLink="{{container === 'Oubox' ?
    '/members/' + message.recipientUsername
    : '/members/' + message.senderUsername}}" [queryParams]="{tab: 3}">
      <td>{{message.content}}</td>
      <td>
        <div *ngIf="container === 'Outbox'">
          <img src="{{message.senderPhotoUrl || './assets/user.png'}}"
               alt="{{message.senderUsername}}"
          class="img-circle rounded-circle mr-2">
          <strong >{{message.senderUsername | titlecase}}</strong>
        </div>
        <div *ngIf="container !== 'Outbox'">
          <img src="{{message.recipientPhotoUrl || './assets/user.png'}}"
               alt="{{message.recipientUsername}}"
               class="img-circle rounded-circle mr-2" style="width: 50px">
          <strong >{{message.recipientUsername | titlecase}}</strong>
        </div>
      </td>
      <td>{{message.messageSend | timeago}}</td>
      <td>
        <button (click)="$event.stopPropagation()" (click)="deleteMessage(message.id)" class="btn btn-danger">Удалить</button>
      </td>
    </tr>
  </table>

</div>
<div class="d-flex justify-content-center" *ngIf="pagination && !loading && messages.length !== 0">
  <pagination
  [boundaryLinks]="true"
  [totalItems]="pagination.totalItems"
  [itemsPerPage]="pagination.itemsPerPage"
  [(ngModel)]="pagination.currentPage"
  (pageChanged)="pageChange($event)"
  previousText="&lsaquo;"
  nextText="&rsaquo;"
  firstText="&laquo;"
  lastText="&raquo;"></pagination>
</div>
